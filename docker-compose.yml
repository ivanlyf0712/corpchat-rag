# CorpChat RAG + Hindsight Memory — 一键启动
# =====================================================
# 用法:
#   docker compose up -d            # 启动全部服务
#   docker compose ps               # 查看状态
#   docker compose logs -f hindsight # 看日志
#   docker compose down             # 停止 (保留数据卷)
#
# 服务:
#   postgres   — pgvector 数据库 (CorpChat 数据源, 140 消息 + 30 联系人)
#   hindsight  — Hindsight 记忆层 (API :8888, Web UI :9999, 数据在 hindsight-data 卷)
#   corpchat   — CorpChat RAG web UI (:8501), 人格由 hindsight bank disposition 驱动

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: invoices
    ports:
      - "5432:5432"
    volumes:
      # 复用旧的 pgdata 卷 (保留 CorpChat 的 140 消息 + 30 联系人数据)
      - ocr-platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d invoices"]
      interval: 5s
      timeout: 3s
      retries: 12

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    environment:
      # LLM: DeepSeek (Hindsight 用 thinking 别名 deepseek-v4-flash)
      HINDSIGHT_API_LLM_PROVIDER: deepseek
      HINDSIGHT_API_LLM_MODEL: deepseek-v4-flash
      # 密钥只从 .env 读取, 缺失即启动失败 (P0 security fix — 不再硬编码)。
      HINDSIGHT_API_LLM_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in .env}
      HINDSIGHT_API_LLM_BASE_URL: https://api.deepseek.com
      # DeepSeek 无 embeddings → 本地模型
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_RERANKER_PROVIDER: flashrank
      HINDSIGHT_API_WORKER_ID: hindsight-prod
    ports:
      - "8888:8888"   # API
      - "9999:9999"   # Control Plane Web UI
    volumes:
      # 复用旧卷 hindsight-data (保留之前 retain 的记忆)
      - hindsight-data:/home/hindsight/.pg0   # 记忆持久化 (pg0 嵌入式库)

  corpchat:
    build: .
    image: corpchat-rag
    container_name: corpchat-rag
    restart: unless-stopped
    environment:
      # DeepSeek LLM (密钥只从 .env 读取, 缺失即启动失败)
      LITELLM_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in .env}
      LITELLM_BASE_URL: https://api.deepseek.com
      LITELLM_MODEL: deepseek-chat
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in .env}
      # CorpChat 数据库 (postgres 服务)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: invoices
      DB_USER: ocr
      DB_PASSWORD: ***REMOVED***
      # 嵌入模型: 自动检测离线 —— config.py 检测到 hf-cache 卷已含 bge-m3 +
      # bge-reranker 时自动设 HF_HUB_OFFLINE=1 (启动离线提速); 未缓存时保持在线
      # 自动拉取 (换模型/清卷无需手动改配置)。如需强制覆盖可显式设 HF_HUB_OFFLINE=0/1。
      # Hindsight 桥接: 人格由 test-bank 的 disposition 驱动
      HINDSIGHT_API_URL: http://hindsight:8888
      HINDSIGHT_BANK_ID: test-bank
    ports:
      - "8501:8501"
    volumes:
      # 模型缓存持久化: warmup/首次搜索要加载 bge-m3 (~2.4G) + bge-reranker (~1.1G),
      # 容器重建后文件系统是全新的, 不加卷每次都要重新下载。
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ocr-platform_pgdata:
    external: true
  hindsight-data:
    external: true
  hf-cache:
